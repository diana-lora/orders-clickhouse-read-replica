spring.application.name=orders-clickhouse-read-replica
server.port=8080
# Health Endpoints diagnostics
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.kafka.enabled=true

# OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=order_user
spring.datasource.password=order_password
spring.datasource.driver-class-name=org.postgresql.Driver
# Clickhouse
clickhouse.datasource.url=jdbc:clickhouse://localhost:8123/orders_analytics
clickhouse.datasource.username=ch_user
clickhouse.datasource.password=ch_password
# Kafka brokers as seen from the ClickHouse server (its Kafka engine consumes the CDC topic)
clickhouse.kafka.broker-list=kafka:29092
# Flyway
spring.flyway.enabled=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=true
spring.kafka.admin.auto-create=true
# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer Configuration
spring.kafka.consumer.group-id=order-history-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.clickreadrep.commons
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.clickreadrep.commons.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Debug Logging for Data JDBC & Transactions
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.data.jdbc=DEBUG
